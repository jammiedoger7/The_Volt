workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        SUPABASE_URL: https://dvgdlsomqujyygqqzzwp.supabase.co
        SUPABASE_ANON_KEY: your-anon-key
        OPENWEATHER_API_KEY: your-weather-key
        # Add these later when you have the keys:
        # OPENAI_API_KEY: your_key
        # BG_REMOVAL_API_KEY: your_key
        # REVENUECAT_API_KEY: your_key
      groups:
        - keystore_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up keystore
        script: |
          echo $KEYSTORE_BASE64 | base64 --decode > /tmp/upload-keystore.jks
          cat >> android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=/tmp/upload-keystore.jks
          EOF
      - name: Create .env file
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          OPENAI_API_KEY=
          OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY
          BG_REMOVAL_API_KEY=
          REVENUECAT_API_KEY=
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android app bundle
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GPLAY_SERVICE_ACCOUNT_JSON
        track: internal
